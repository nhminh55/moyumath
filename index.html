<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân — Toán 7</title>
<script>
  if(!localStorage.getItem('moyumath_user')){
    window.location.replace('login.html?redirect=index.html');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F3;
    --paper-edge:#F1ECE0;
    --ink:#213A54;
    --ink-soft:#4B5A6B;
    --graphite:#3E3B34;
    --pen-red:#B23A2E;
    --pen-green:#3C7A5B;
    --gold:#B08D3E;
    --border:#E3DFD2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E8E2D2;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.4), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.25), transparent 45%);
    font-family:'Inter',sans-serif;
    color:var(--graphite);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:820px; margin:0 auto;}

  .card{
    background:var(--paper);
    border:1px solid var(--paper-edge);
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 18px 40px -20px rgba(33,58,84,0.35);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:18px;
  }

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-family:'Lora',serif;
    font-size:22px;
    color:var(--ink);
    margin:0 0 4px;
  }
  header.top .meta{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  header.top .meta b{color:var(--ink);}
  .nav-links{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:right;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-links a{color:var(--ink-soft); text-decoration:none;}
  .nav-links a:hover{color:var(--ink); text-decoration:underline;}
  .admin-link-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    color:var(--ink) !important;
    background:#fff;
    border:1.5px solid var(--gold);
    padding:6px 14px;
    border-radius:14px;
    text-decoration:none !important;
    transition:transform .12s ease, background .15s;
  }
  .admin-link-btn:hover{background:#FBF4E4; transform:translateY(-1px);}

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
  }
  .stat-tile{
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:8px;
    padding:14px 12px;
    text-align:center;
  }
  .stat-tile .label{
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .stat-tile .value{
    font-family:'Caveat',cursive;
    font-size:32px;
    color:var(--ink);
    line-height:1;
  }
  .stat-tile.mastery .value{color:var(--pen-green);}
  @media (max-width:560px){
    .stat-grid{grid-template-columns:1fr; }
  }

  h2.section-title{
    font-family:'Lora',serif;
    font-size:17px;
    color:var(--ink);
    margin:0 0 14px;
  }

  .chapter-card{
    border:1.5px solid var(--border);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:12px;
    background:#fff;
  }
  .chapter-card.disabled{opacity:0.55;}
  .chapter-card .chap-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .chapter-card h3{
    font-family:'Lora',serif;
    font-size:16px;
    color:var(--ink);
    margin:0;
  }
  .chapter-card .soon-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--paper-edge);
    padding:3px 10px;
    border-radius:10px;
  }
  .chapter-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .chapter-actions a{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 18px;
    border-radius:20px;
    text-decoration:none;
    display:inline-block;
    transition:transform .12s ease;
  }
  .chapter-actions a:hover{transform:translateY(-1px);}
  .chapter-actions .primary{background:var(--ink); color:#fff;}
  .chapter-actions .secondary{background:#fff; color:var(--ink); border:1.5px solid var(--gold);}

  table.mini-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  table.mini-table th, table.mini-table td{
    text-align:left;
    padding:8px 4px;
    border-bottom:1px solid var(--border);
  }
  table.mini-table th{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--ink-soft);
  }
  table.mini-table td.score{
    font-family:'Lora',serif;
    font-weight:600;
    color:var(--pen-red);
  }
  .empty-note{color:var(--ink-soft); font-size:13.5px;}

  .comment-box{
    font-size:13.5px;
    line-height:1.7;
    color:var(--graphite);
  }
  .comment-box b.good{color:var(--pen-green);}
  .comment-box b.bad{color:var(--pen-red);}
</style>
</head>
<body>

<div class="wrap">

  <div class="card">
    <header class="top">
      <div>
        <h1>Trang cá nhân</h1>
        <div class="meta">Họ tên: <b id="pfName">—</b> &nbsp;·&nbsp; Lớp: <b id="pfClass">—</b></div>
      </div>
      <div class="nav-links">
        <a href="admin.html" class="admin-link-btn">⚙ Admin</a>
        <a href="#" id="logoutLink">Đăng xuất</a>
      </div>
    </header>
  </div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat-tile">
        <div class="label">Bài kiểm tra đã làm</div>
        <div class="value" id="statExamCount">0</div>
      </div>
      <div class="stat-tile">
        <div class="label">Câu đã luyện</div>
        <div class="value" id="statPracticeCount">0</div>
      </div>
      <div class="stat-tile mastery">
        <div class="label">Nắm kiến thức Chương 1</div>
        <div class="value" id="statMastery">—</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Các chương</h2>
    <div class="chapter-card">
      <div class="chap-head">
        <h3>Chương 1 — Số tự nhiên, số nguyên, số hữu tỉ</h3>
      </div>
      <div class="chapter-actions">
        <a class="primary" href="exam.html">📝 Bài kiểm tra 15 phút</a>
        <a class="secondary" href="practice.html">✏️ Luyện tập theo câu</a>
      </div>
    </div>
    <div class="chapter-card disabled">
      <div class="chap-head">
        <h3>Chương 2</h3>
        <span class="soon-tag">Sắp ra mắt</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Lịch sử bài kiểm tra</h2>
    <div id="examHistory"><p class="empty-note">Đang tải...</p></div>
  </div>

  <div class="card">
    <h2 class="section-title">Nhận xét</h2>
    <div class="comment-box" id="commentBox">Đang tải...</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCgaB8J61BqBhU4NwXq9MYBrRFRREYuxGg",
    authDomain: "moyumath.firebaseapp.com",
    projectId: "moyumath",
    storageBucket: "moyumath.firebasestorage.app",
    messagingSenderId: "690475633701",
    appId: "1:690475633701:web:e839cdeee12e9b1456c3cc",
    measurementId: "G-9RPGBW0VK5"
  };
  var firebaseApp = initializeApp(firebaseConfig);
  var db = getFirestore(firebaseApp);

  var CHART_QUESTIONS = ['Câu 1', 'Câu 2', 'Câu 3', 'Câu 4', 'Câu 5'];

  function formatTime(ts){
    if(!ts || !ts.toDate) return '';
    return ts.toDate().toLocaleString('vi-VN');
  }

  var displayName = localStorage.getItem('moyumath_displayName') || '';
  var className = localStorage.getItem('moyumath_class') || '';
  document.getElementById('pfName').textContent = displayName || '—';
  document.getElementById('pfClass').textContent = className || '—';

  document.getElementById('logoutLink').addEventListener('click', function(e){
    e.preventDefault();
    localStorage.removeItem('moyumath_user');
    localStorage.removeItem('moyumath_displayName');
    localStorage.removeItem('moyumath_class');
    window.location.href = 'login.html';
  });

  if(!displayName){
    document.getElementById('examHistory').innerHTML = '<p class="empty-note">Không xác định được học sinh.</p>';
    document.getElementById('commentBox').textContent = 'Không xác định được học sinh.';
  } else {
    Promise.all([
      getDocs(query(collection(db, 'Đã làm', displayName, 'bài làm'), orderBy('createdAt', 'desc'))).catch(function(){
        return getDocs(collection(db, 'Đã làm', displayName, 'bài làm'));
      }),
      getDocs(collection(db, 'Đã làm', displayName, 'luyện tập'))
    ]).then(function(results){
      var examDocs = [];
      results[0].forEach(function(d){ examDocs.push(d.data()); });
      examDocs.sort(function(a,b){
        var ta = a.createdAt ? a.createdAt.toMillis() : 0;
        var tb = b.createdAt ? b.createdAt.toMillis() : 0;
        return tb - ta;
      });

      var practiceDocs = [];
      results[1].forEach(function(d){ practiceDocs.push(d.data()); });

      /* ---- thống kê tổng quát ---- */
      document.getElementById('statExamCount').textContent = examDocs.length;
      var practiceCount = practiceDocs.reduce(function(sum, s){ return sum + (s.totalQuestions || 0); }, 0);
      document.getElementById('statPracticeCount').textContent = practiceCount;

      /* ---- gộp điểm theo từng câu để tính % nắm kiến thức ---- */
      var byQuestion = {};
      function addStat(label, earned, max){
        if(max <= 0) return;
        if(!byQuestion[label]) byQuestion[label] = { earned:0, max:0 };
        byQuestion[label].earned += earned;
        byQuestion[label].max += max;
      }
      examDocs.forEach(function(s){
        var byQ = s.byQuestion || {};
        Object.keys(byQ).forEach(function(k){
          addStat(k, byQ[k].earned || 0, byQ[k].max || 0);
        });
      });
      practiceDocs.forEach(function(s){
        var byQ = s.byQuestion || {};
        Object.keys(byQ).forEach(function(k){
          var v = byQ[k];
          addStat(k, v.totalEarned || 0, (v.max || 0) * (v.count || 0));
        });
      });

      var totalEarned = 0, totalMax = 0;
      Object.keys(byQuestion).forEach(function(k){
        totalEarned += byQuestion[k].earned;
        totalMax += byQuestion[k].max;
      });
      var masteryEl = document.getElementById('statMastery');
      if(totalMax > 0){
        masteryEl.textContent = Math.round(totalEarned/totalMax*100) + '%';
      } else {
        masteryEl.textContent = '—';
      }

      /* ---- lịch sử bài kiểm tra ---- */
      var histEl = document.getElementById('examHistory');
      if(examDocs.length === 0){
        histEl.innerHTML = '<p class="empty-note">Chưa làm bài kiểm tra nào.</p>';
      } else {
        histEl.innerHTML = '<table class="mini-table"><thead><tr><th>Thời gian</th><th>Điểm</th></tr></thead><tbody>' +
          examDocs.slice(0, 10).map(function(s){
            return '<tr><td>' + formatTime(s.createdAt) + '</td><td class="score">' + (s.score || '') + '</td></tr>';
          }).join('') +
        '</tbody></table>';
      }

      /* ---- nhận xét điểm mạnh / yếu ---- */
      var commentEl = document.getElementById('commentBox');
      var strengths = [], weaknesses = [], mediums = [];
      CHART_QUESTIONS.forEach(function(label){
        var v = byQuestion[label];
        if(!v || v.max <= 0) return;
        var pct = v.earned / v.max * 100;
        var item = label + ' (' + pct.toFixed(0) + '%)';
        if(pct >= 80) strengths.push(item);
        else if(pct < 60) weaknesses.push(item);
        else mediums.push(item);
      });
      if(strengths.length === 0 && weaknesses.length === 0 && mediums.length === 0){
        commentEl.textContent = 'Chưa có đủ dữ liệu (bài kiểm tra hoặc luyện tập) để nhận xét.';
      } else {
        var parts = [];
        if(strengths.length) parts.push('<b class="good">Điểm mạnh:</b> ' + strengths.join(', ') + '.');
        if(weaknesses.length) parts.push('<b class="bad">Cần cải thiện:</b> ' + weaknesses.join(', ') + '.');
        if(mediums.length) parts.push('Ở mức khá: ' + mediums.join(', ') + '.');
        commentEl.innerHTML = parts.join(' ');
      }
    }).catch(function(err){
      console.error(err);
      document.getElementById('examHistory').innerHTML = '<p class="empty-note">Lỗi tải dữ liệu: ' + err.message + '</p>';
      document.getElementById('commentBox').textContent = 'Lỗi tải dữ liệu.';
    });
  }
</script>

</body>
</html>

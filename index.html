<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề kiểm tra Toán 7 — Chương 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F3;
    --paper-edge:#F1ECE0;
    --rule:#CBD9E6;
    --margin-line:#E3A9A0;
    --ink:#213A54;
    --ink-soft:#4B5A6B;
    --graphite:#3E3B34;
    --pen-red:#B23A2E;
    --pen-green:#3C7A5B;
    --gold:#B08D3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E8E2D2;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.4), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.25), transparent 45%);
    font-family:'Lora', serif;
    color:var(--graphite);
    min-height:100vh;
    padding:40px 16px 100px;
  }

  .sheet{
    max-width:720px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--paper-edge);
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 18px 40px -20px rgba(33,58,84,0.35);
    position:relative;
    padding:38px 40px 50px 64px;
    border-radius:2px;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:44px;
    width:1px;
    background:var(--margin-line);
    opacity:0.55;
  }

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  .id-field{flex:1; min-width:220px;}
  .id-field label{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    display:block;
    margin-bottom:6px;
  }
  .id-field input[type="text"]{
    font-family:'Lora',serif;
    font-size:16px;
    border:none;
    border-bottom:1px dotted #9AA7B3;
    background:transparent;
    width:100%;
    padding:2px 2px 6px;
    color:var(--ink);
  }
  .id-field input[type="text"]:focus{outline:none; border-bottom-color:var(--ink);}
  .exam-title{
    text-align:right;
  }
  .exam-title h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--ink);
    font-weight:600;
  }
  .exam-title p{
    margin:0;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .variant-tag{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    color:var(--gold);
    margin-top:6px;
    letter-spacing:0.03em;
  }

  .score-box{
    border:1.5px solid var(--ink);
    border-radius:3px;
    padding:8px 16px;
    text-align:center;
    min-width:96px;
    background:#fff;
  }
  .score-box .label{
    font-family:'Inter',sans-serif;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  .score-box .value{
    font-family:'Caveat',cursive;
    font-size:34px;
    color:var(--pen-red);
    line-height:1.1;
  }
  .score-box .value .max{font-size:18px; color:var(--ink-soft); font-family:'Lora',serif;}

  section.question{
    margin-bottom:34px;
    padding-bottom:26px;
    border-bottom:1px dashed var(--rule);
  }
  section.question:last-of-type{border-bottom:none;}

  .q-head{
    font-weight:600;
    color:var(--ink);
    font-size:17px;
    margin-bottom:10px;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .q-head .pts{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper-edge);
    padding:2px 8px;
    border-radius:10px;
  }
  .q-prompt{margin:0 0 14px; line-height:1.65; color:var(--graphite);}
  .q-prompt i{color:var(--ink);}

  .sub{margin-bottom:14px;}
  .sub-label{font-weight:500; color:var(--ink); margin-right:6px;}

  input[type="text"].blank, input[type="number"].blank{
    font-family:'Lora',serif;
    font-size:15.5px;
    border:none;
    border-bottom:1.5px dotted #9AA7B3;
    background:transparent;
    padding:3px 4px;
    color:var(--ink);
    min-width:70px;
  }
  input.blank:focus{outline:none; border-bottom-color:var(--ink);}
  .hint{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:#8B8477;
    margin-top:4px;
  }

  .factor-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px;}

  .exponent-line{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; font-size:15.5px;}
  .base3{font-style:italic;}

  .number-strip{
    display:flex;
    justify-content:space-between;
    border:1.5px solid var(--ink);
    border-radius:4px;
    padding:14px 10px;
    margin:8px 0 20px;
    background:#fff;
  }
  .number-strip span{font-size:16px; color:var(--ink);}

  .checkbox-grid{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .chk{
    font-family:'Inter',sans-serif;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--graphite);
    border:1px solid #DDD6C4;
    padding:6px 12px;
    border-radius:16px;
    cursor:pointer;
    background:#fff;
    transition:border-color .15s, background .15s;
  }
  .chk:hover{border-color:var(--ink-soft);}
  .chk input{accent-color:var(--ink);}
  .chk.marked-correct{border-color:var(--pen-green); background:#F1F8F4;}
  .chk.marked-wrong{border-color:var(--pen-red); background:#FBF0EE;}

  .venn-wrap{
    display:flex;
    gap:28px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .venn-svg{flex:0 0 auto;}
  .venn-selects{flex:1; min-width:220px; display:flex; flex-direction:column; gap:10px;}
  .venn-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Inter',sans-serif; font-size:14px;}
  .venn-row select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid #C9C1AC;
    background:#fff;
    color:var(--ink);
  }

  .feedback{
    font-family:'Caveat',cursive;
    font-size:20px;
    margin-top:8px;
    display:none;
    align-items:center;
    gap:8px;
  }
  .feedback.show{display:flex;}
  .feedback.correct{color:var(--pen-green);}
  .feedback.wrong{color:var(--pen-red);}
  .feedback .mark{font-size:26px; line-height:1;}
  .feedback .note{font-family:'Inter',sans-serif; font-size:12.5px; color:var(--ink-soft);}

  .actions{
    max-width:720px;
    margin:26px auto 0;
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:13px 30px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #gradeBtn{
    background:var(--ink);
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(33,58,84,0.6);
  }
  #gradeBtn:hover{transform:translateY(-1px);}
  #shuffleBtn{
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--gold);
  }
  #shuffleBtn:hover{transform:translateY(-1px); background:#FBF4E4;}
  #resetBtn{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid #C9C1AC;
  }
  #resetBtn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .summary-note{
    max-width:720px;
    margin:14px auto 0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:600px){
    .sheet{padding:30px 20px 40px 40px;}
    .sheet::before{left:24px;}
    header.top{flex-direction:column;}
    .exam-title{text-align:left;}
    .number-strip{flex-wrap:wrap; gap:10px; justify-content:flex-start;}
    .venn-wrap{flex-direction:column; align-items:stretch;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:12px 22px;
    border-radius:24px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--pen-red);}
</style>
</head>

  <section class="question" id="q2">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){

  /* ---------- small helpers ---------- */
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pick(arr){ return arr[randInt(0,arr.length-1)]; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = randInt(0,i);
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  var SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  function sup(n){ return String(n).split('').map(function(d){return SUP[d]||d;}).join(''); }
  function gcdOf(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }
  function lcmOf(a,b){ return Math.abs(a*b)/gcdOf(a,b); }
  function factorize(n){
    var map={}, x=n, d=2;
    while(d*d<=x){
      while(x%d===0){ map[d]=(map[d]||0)+1; x/=d; }
      d++;
    }
    if(x>1) map[x]=(map[x]||0)+1;
    return map;
  }
  function num(str){
    if(str===null || str===undefined) return NaN;
    str = String(str).trim().replace(',', '.');
    return parseFloat(str);
  }
  function setFeedback(id, correct, note){
    var el = document.getElementById(id);
    if(!el) return;
    el.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
    el.innerHTML = '<span class="mark">' + (correct ? '✓' : '✗') + '</span>' +
                    (note ? '<span class="note">' + note + '</span>' : '');
  }
  function clearFeedback(){
    document.querySelectorAll('.feedback').forEach(function(f){ f.className='feedback'; f.innerHTML=''; });
  }

  /* ---------- factorization parsing (for câu 1) ---------- */
  function parseFactorization(str){
    if(!str) return {};
    str = str.toLowerCase().replace(/\s+/g,'');
    var supMap = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
    str = str.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function(m){ return '^' + supMap[m]; });
    var tokens = str.split(/[x×*.]/).filter(Boolean);
    var map = {};
    tokens.forEach(function(t){
      var parts = t.split('^');
      var base = parseInt(parts[0], 10);
      var exp = parts[1] ? parseInt(parts[1], 10) : 1;
      if(!isNaN(base)){ map[base] = (map[base] || 0) + exp; }
    });
    return map;
  }
  function factorizationMatches(map, target){
    var keys1 = Object.keys(map).filter(function(k){ return map[k] !== 0; });
    var keys2 = Object.keys(target);
    if(keys1.length !== keys2.length) return false;
    return keys2.every(function(k){ return map[k] === target[k]; });
  }
  function parseNumberSet(str){
    if(!str) return [];
    var matches = str.match(/-?\d+(\.\d+)?/g) || [];
    var out = [];
    matches.forEach(function(m){
      var v = parseFloat(m);
      if(!isNaN(v) && out.indexOf(v) === -1) out.push(v);
    });
    return out;
  }
  function sameSet(a, b){
    if(a.length !== b.length) return false;
    var sa = a.slice().sort(function(x,y){return x-y;});
    var sb = b.slice().sort(function(x,y){return x-y;});
    return sa.every(function(v,i){ return Math.abs(v - sb[i]) < 1e-9; });
  }
  function sameIndexSet(a,b){
    if(a.length!==b.length) return false;
    var sa=a.slice().sort(); var sb=b.slice().sort();
    return sa.every(function(v,i){return v===sb[i];});
  }

  /* ---------- question pools ---------- */
  var PAIR_POOL = [[60,72],[24,36],[18,48],[45,60],[36,90],[16,40],[28,42],
                    [50,75],[32,48],[20,30],[12,18],[27,36],[40,60],[54,72],[35,105]];
  var lastPairIdx = -1;

  var answerKey = {};
  var variantNumber = 0;

  function generateVariant(){
    answerKey = {};
    variantNumber++;

    /* Câu 1 */
    var idx;
    do { idx = randInt(0, PAIR_POOL.length-1); } while(idx === lastPairIdx);
    lastPairIdx = idx;
    var n1 = PAIR_POOL[idx][0], n2 = PAIR_POOL[idx][1];
    answerKey.n1 = n1; answerKey.n2 = n2;
    answerKey.f1 = factorize(n1);
    answerKey.f2 = factorize(n2);
    answerKey.gcd = gcdOf(n1,n2);
    answerKey.lcm = lcmOf(n1,n2);

    /* Câu 2 */
    var k = randInt(2,12);
    answerKey.k = k;
    answerKey.xTarget = [k, -k];

    /* Câu 3 */
    var base = pick([2,3,5]);
    var p1a = randInt(2,6), p2a = randInt(2,5);
    var p1b = randInt(6,9), p2b = randInt(2, p1b-2);
    var p1c = randInt(2,4), p2c = randInt(2,4);
    var p1d = randInt(6,10);
    answerKey.base = base;
    answerKey.c3 = {
      p1a:p1a, p2a:p2a, ansA: p1a+p2a,
      p1b:p1b, p2b:p2b, ansB: p1b-p2b,
      p1c:p1c, p2c:p2c, ansC: p1c*p2c,
      p1d:p1d, ansD: p1d-1
    };

    /* Câu 4 */
    var a4 = randInt(2,9);
    var sq = pick([1,2,3,4,5,6]);
    var b4 = sq*sq;
    var c4v = randInt(1,9), d4v = randInt(1,9);
    var result4 = a4*a4 + sq*(c4v-d4v);
    answerKey.c4 = { a:a4, b:b4, sqrtB:sq, c:c4v, d:d4v, result: result4 };

    /* Câu 5 */
    var neg = -randInt(1,15);
    var decInt = randInt(1,9);
    var mixInt; do { mixInt = randInt(1,9); } while(mixInt === decInt);
    var nat1 = randInt(1,20);
    var nat2; do { nat2 = randInt(1,20); } while(nat2 === nat1);

    var nums = [
      { value: neg, label: '−' + Math.abs(neg) },
      { value: decInt + 0.5, label: decInt + ',5' },
      { value: nat1, label: String(nat1) },
      { value: mixInt + 0.5, label: mixInt + ' ½' },
      { value: nat2, label: String(nat2) }
    ];
    answerKey.numbers5 = shuffle(nums);
    window.__answerKey = answerKey; // exposed for debugging/testing
  }

  function regionOf(v){
    if(Number.isInteger(v) && v >= 0) return 'N';
    if(Number.isInteger(v)) return 'Z';
    return 'Q';
  }

  /* ---------- render ---------- */
  function renderAll(){
    document.getElementById('variantTag').textContent = 'Đề số ' + variantNumber;
    renderQ1();
    renderQ2();
    renderQ3();
    renderQ4();
    renderQ5();
    clearFeedback();
    document.getElementById('scoreValue').innerHTML = '—<span class="max">/10</span>';
    document.getElementById('summaryNote').textContent = '';
  }

  function renderQ1(){
    var n1 = answerKey.n1, n2 = answerKey.n2;
    document.getElementById('q1-body').innerHTML =
      '<div class="sub">' +
        '<span class="sub-label">a.</span> Phân tích số ' + n1 + ' và ' + n2 + ' ra thừa số nguyên tố.' +
        '<div class="factor-row" style="margin-top:8px;">' + n1 + ' &nbsp;=&nbsp; ' +
          '<input type="text" class="blank" id="c1a-1" placeholder="vd: 2^2 x 3 x 5"></div>' +
        '<div class="factor-row">' + n2 + ' &nbsp;=&nbsp; ' +
          '<input type="text" class="blank" id="c1a-2" placeholder="vd: 2^3 x 3^2"></div>' +
        '<span class="hint">Nhập dạng lũy thừa dùng dấu ^ , ví dụ 2^2 x 3 x 5 — thứ tự các thừa số không quan trọng.</span>' +
        '<div class="feedback" id="fb-c1a"></div>' +
      '</div>' +
      '<div class="sub">' +
        '<span class="sub-label">b.</span> Tìm ước chung lớn nhất (ƯCLN) của ' + n1 + ' và ' + n2 + ': ' +
        '<input type="text" class="blank" id="c1b" style="width:80px;">' +
        '<div class="feedback" id="fb-c1b"></div>' +
      '</div>' +
      '<div class="sub">' +
        '<span class="sub-label">c.</span> Tìm bội chung nhỏ nhất (BCNN) của ' + n1 + ' và ' + n2 + ': ' +
        '<input type="text" class="blank" id="c1c" style="width:80px;">' +
        '<div class="feedback" id="fb-c1c"></div>' +
      '</div>';
  }

  function renderQ2(){
    document.getElementById('q2-body').innerHTML =
      '<p class="q-prompt">Tìm tất cả các giá trị của <i>x</i> thoả mãn <i>x</i>² = ' + (answerKey.k*answerKey.k) + '</p>' +
      '<div class="sub">' +
        '<span class="sub-label">x =</span> ' +
        '<input type="text" class="blank" id="c2" placeholder="vd: 8 ; -8">' +
        '<span class="hint">Nếu có nhiều giá trị, cách nhau bằng dấu phẩy.</span>' +
        '<div class="feedback" id="fb-c2"></div>' +
      '</div>';
  }

  function renderQ3(){
    var b = answerKey.base;
    var c3 = answerKey.c3;
    document.getElementById('q3-body').innerHTML =
      '<div class="sub exponent-line"><span class="sub-label">a.</span> ' + b + sup(c3.p1a) + ' × ' + b + sup(c3.p2a) +
        ' &nbsp;=&nbsp; <span class="base3">' + b + '</span>^' +
        '<input type="text" class="blank" id="c3a" style="width:56px;"><span class="feedback" id="fb-c3a"></span></div>' +
      '<div class="sub exponent-line"><span class="sub-label">b.</span> ' + b + sup(c3.p1b) + ' ÷ ' + b + sup(c3.p2b) +
        ' &nbsp;=&nbsp; <span class="base3">' + b + '</span>^' +
        '<input type="text" class="blank" id="c3b" style="width:56px;"><span class="feedback" id="fb-c3b"></span></div>' +
      '<div class="sub exponent-line"><span class="sub-label">c.</span> (' + b + sup(c3.p1c) + ')' + sup(c3.p2c) +
        ' &nbsp;=&nbsp; <span class="base3">' + b + '</span>^' +
        '<input type="text" class="blank" id="c3c" style="width:56px;"><span class="feedback" id="fb-c3c"></span></div>' +
      '<div class="sub exponent-line"><span class="sub-label">d.</span> ' + b + sup(c3.p1d) + ' ÷ ' + b + ' × ' + b + sup(0) +
        ' &nbsp;=&nbsp; <span class="base3">' + b + '</span>^' +
        '<input type="text" class="blank" id="c3d" style="width:56px;"><span class="feedback" id="fb-c3d"></span></div>';
  }

  function renderQ4(){
    var c4 = answerKey.c4;
    document.getElementById('q4-body').innerHTML =
      '<p style="text-align:center; font-size:19px; color:var(--ink); margin:0 0 14px;">' +
        c4.a + sup(2) + ' + √' + c4.b + ' × (' + c4.c + ' − ' + c4.d + ')' +
      '</p>' +
      '<div class="sub">' +
        '<span class="sub-label">Kết quả =</span> ' +
        '<input type="text" class="blank" id="c4" style="width:90px;">' +
        '<div class="feedback" id="fb-c4"></div>' +
      '</div>';
  }

  function renderQ5(){
    var nums = answerKey.numbers5;
    var stripHtml = nums.map(function(n){ return '<span>' + n.label + '</span>'; }).join('');
    function checkboxGroup(group){
      return nums.map(function(n,i){
        return '<label class="chk"><input type="checkbox" data-idx="' + i + '">' + n.label + '</label>';
      }).join('');
    }
    var vennRows = nums.map(function(n,i){
      return '<div class="venn-row">' + n.label +
        ' <select id="v-' + i + '"><option value="">— chọn —</option><option value="N">N</option><option value="Z">Z</option><option value="Q">Q</option></select></div>';
    }).join('');

    document.getElementById('q5-body').innerHTML =
      '<div class="number-strip">' + stripHtml + '</div>' +
      '<div class="sub"><span class="sub-label">a. Các số tự nhiên:</span>' +
        '<div class="checkbox-grid" data-group="c5a">' + checkboxGroup('c5a') + '</div>' +
        '<div class="feedback" id="fb-c5a"></div></div>' +
      '<div class="sub"><span class="sub-label">b. Các số nguyên:</span>' +
        '<div class="checkbox-grid" data-group="c5b">' + checkboxGroup('c5b') + '</div>' +
        '<div class="feedback" id="fb-c5b"></div></div>' +
      '<div class="sub"><span class="sub-label">c. Các số hữu tỉ:</span>' +
        '<div class="checkbox-grid" data-group="c5c">' + checkboxGroup('c5c') + '</div>' +
        '<div class="feedback" id="fb-c5c"></div></div>' +
      '<div class="sub"><span class="sub-label">d. Sắp xếp vào biểu đồ Venn — chọn tập hợp nhỏ nhất mà mỗi số thuộc về:</span>' +
        '<div class="venn-wrap">' +
          '<svg class="venn-svg" width="180" height="200" viewBox="0 0 180 200">' +
            '<circle cx="90" cy="105" r="90" fill="none" stroke="#213A54" stroke-width="2"/>' +
            '<circle cx="90" cy="112" r="60" fill="none" stroke="#213A54" stroke-width="2"/>' +
            '<circle cx="90" cy="122" r="32" fill="none" stroke="#213A54" stroke-width="2"/>' +
            '<text x="90" y="30" text-anchor="middle" font-family="Lora, serif" font-weight="600" font-size="18" fill="#213A54">Q</text>' +
            '<text x="90" y="65" text-anchor="middle" font-family="Lora, serif" font-weight="600" font-size="16" fill="#213A54">Z</text>' +
            '<text x="90" y="98" text-anchor="middle" font-family="Lora, serif" font-weight="600" font-size="15" fill="#213A54">N</text>' +
          '</svg>' +
          '<div class="venn-selects">' + vennRows + '</div>' +
        '</div>' +
        '<div class="feedback" id="fb-c5d"></div>' +
      '</div>';
  }

  /* ---------- grading ---------- */
  function getCheckedIdx(group){
    var boxes = document.querySelectorAll('.checkbox-grid[data-group="'+group+'"] input[type=checkbox]');
    var out = [];
    boxes.forEach(function(b){ if(b.checked) out.push(parseInt(b.dataset.idx,10)); });
    return out;
  }
  function markCheckboxes(group, correctIdxSet){
    var labels = document.querySelectorAll('.checkbox-grid[data-group="'+group+'"] .chk');
    labels.forEach(function(label){
      var input = label.querySelector('input');
      var i = parseInt(input.dataset.idx,10);
      var shouldBeChecked = correctIdxSet.indexOf(i) !== -1;
      label.classList.remove('marked-correct','marked-wrong');
      label.classList.add(input.checked === shouldBeChecked ? 'marked-correct' : 'marked-wrong');
    });
  }

  function grade(){
    var total = 0;

    /* Câu 1 */
    var f1in = parseFactorization(document.getElementById('c1a-1').value);
    var f2in = parseFactorization(document.getElementById('c1a-2').value);
    var ok1 = factorizationMatches(f1in, answerKey.f1);
    var ok2 = factorizationMatches(f2in, answerKey.f2);
    var pts1a = (ok1?0.5:0) + (ok2?0.5:0);
    total += pts1a;
    var f1str = Object.keys(answerKey.f1).map(function(p){ return answerKey.f1[p]>1 ? p+'^'+answerKey.f1[p] : p; }).join(' x ');
    var f2str = Object.keys(answerKey.f2).map(function(p){ return answerKey.f2[p]>1 ? p+'^'+answerKey.f2[p] : p; }).join(' x ');
    setFeedback('fb-c1a', pts1a===1, pts1a===1 ? '+1 điểm' : ('Đáp án: '+answerKey.n1+' = '+f1str+' ; '+answerKey.n2+' = '+f2str+'  ('+pts1a+' điểm)'));

    var b1 = num(document.getElementById('c1b').value);
    var okB = Math.abs(b1-answerKey.gcd) < 1e-9;
    total += okB ? 1 : 0;
    setFeedback('fb-c1b', okB, okB ? '+1 điểm' : ('Đáp án đúng: '+answerKey.gcd));

    var c1v = num(document.getElementById('c1c').value);
    var okC = Math.abs(c1v-answerKey.lcm) < 1e-9;
    total += okC ? 1 : 0;
    setFeedback('fb-c1c', okC, okC ? '+1 điểm' : ('Đáp án đúng: '+answerKey.lcm));

    /* Câu 2 */
    var xs = parseNumberSet(document.getElementById('c2').value);
    var target2 = answerKey.xTarget;
    var matchCount = target2.filter(function(t){ return xs.indexOf(t) !== -1; }).length;
    var extra = xs.filter(function(v){ return target2.indexOf(v) === -1; }).length;
    var pts2 = (matchCount===2 && extra===0) ? 1 : (matchCount>=1 && extra===0 ? 0.5 : 0);
    total += pts2;
    setFeedback('fb-c2', pts2===1, pts2===1 ? '+1 điểm' : ('Đáp án đúng: x = '+target2[0]+' hoặc x = '+target2[1]+'  ('+pts2+' điểm)'));

    /* Câu 3 */
    var c3 = answerKey.c3;
    [['c3a',c3.ansA],['c3b',c3.ansB],['c3c',c3.ansC],['c3d',c3.ansD]].forEach(function(pair){
      var v = num(document.getElementById(pair[0]).value);
      var ok = Math.abs(v-pair[1]) < 1e-9;
      total += ok ? 0.5 : 0;
      setFeedback('fb-'+pair[0], ok, ok ? '+0.5' : ('Đáp án: '+answerKey.base+'^'+pair[1]));
    });

    /* Câu 4 */
    var v4 = num(document.getElementById('c4').value);
    var ok4 = Math.abs(v4-answerKey.c4.result) < 1e-9;
    total += ok4 ? 2 : 0;
    var c4 = answerKey.c4;
    setFeedback('fb-c4', ok4, ok4 ? '+2 điểm' : ('Đáp án đúng: '+c4.result+'  ('+c4.a+'² + √'+c4.b+'×('+c4.c+'−'+c4.d+') = '+(c4.a*c4.a)+' + '+c4.sqrtB+'×('+(c4.c-c4.d)+') = '+c4.result+')'));

    /* Câu 5 */
    var nums = answerKey.numbers5;
    var idxAll = nums.map(function(n,i){return i;});
    var idxN = idxAll.filter(function(i){ return regionOf(nums[i].value)==='N'; });
    var idxZ = idxAll.filter(function(i){ return regionOf(nums[i].value)==='N' || regionOf(nums[i].value)==='Z'; });
    var idxQ = idxAll;

    var chosen5a = getCheckedIdx('c5a');
    var ok5a = sameIndexSet(chosen5a, idxN);
    total += ok5a ? 0.5 : 0;
    markCheckboxes('c5a', idxN);
    setFeedback('fb-c5a', ok5a, ok5a ? '+0.5' : ('Đáp án đúng: ' + idxN.map(function(i){return nums[i].label;}).join(' ; ')));

    var chosen5b = getCheckedIdx('c5b');
    var ok5b = sameIndexSet(chosen5b, idxZ);
    total += ok5b ? 0.5 : 0;
    markCheckboxes('c5b', idxZ);
    setFeedback('fb-c5b', ok5b, ok5b ? '+0.5' : ('Đáp án đúng: ' + idxZ.map(function(i){return nums[i].label;}).join(' ; ')));

    var chosen5c = getCheckedIdx('c5c');
    var ok5c = sameIndexSet(chosen5c, idxQ);
    total += ok5c ? 0.5 : 0;
    markCheckboxes('c5c', idxQ);
    setFeedback('fb-c5c', ok5c, ok5c ? '+0.5' : 'Đáp án đúng: cả 5 số đều là số hữu tỉ');

    var vennCorrectCount = 0;
    var vennAnsParts = [];
    nums.forEach(function(n,i){
      var sel = document.getElementById('v-'+i);
      var correctRegion = regionOf(n.value);
      vennAnsParts.push(n.label+'→'+correctRegion);
      if(sel.value === correctRegion){
        vennCorrectCount++;
        sel.style.borderColor = 'var(--pen-green)';
      } else {
        sel.style.borderColor = 'var(--pen-red)';
      }
    });
    var pts5d = vennCorrectCount * 0.1;
    total += pts5d;
    setFeedback('fb-c5d', vennCorrectCount===5, 'Đúng '+vennCorrectCount+'/5 ('+pts5d.toFixed(1)+' điểm) · Đáp án: '+vennAnsParts.join(', '));

    total = Math.round(total*10)/10;
    document.getElementById('scoreValue').innerHTML = total + '<span class="max">/10</span>';

    var note = document.getElementById('summaryNote');
    if(total>=9) note.textContent = 'Xuất sắc! '+total+'/10 điểm.';
    else if(total>=7) note.textContent = 'Khá tốt — '+total+'/10 điểm. Xem lại các câu có dấu ✗ nhé.';
    else if(total>=5) note.textContent = 'Đạt yêu cầu — '+total+'/10 điểm. Cần ôn lại một số phần.';
    else note.textContent = 'Cần cố gắng hơn — '+total+'/10 điểm. Xem lại đáp án ở từng câu.';

    saveSubmission(total);
  }

  function saveSubmission(total){
    var nameInput = document.getElementById('studentName');
    var name = (nameInput.value || '').trim();
    if(!name){
      alert('Vui lòng nhập Họ tên trước khi chấm điểm để lưu bài làm.');
      return;
    }
    if(typeof html2canvas !== 'function' || !window.__saveSubmission){
      console.warn('html2canvas hoặc Firebase chưa sẵn sàng, không thể lưu bài làm.');
      return;
    }
    showToast('Đang lưu bài làm...');
    html2canvas(document.querySelector('.sheet'), {backgroundColor:'#FBF9F3', scale:2}).then(function(canvas){
      var imageDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return window.__saveSubmission(name, total + '/10', imageDataUrl);
    }).then(function(){
      showToast('✓ Đã lưu bài làm của ' + name + '!');
    }).catch(function(err){
      console.error('Lỗi khi lưu bài làm:', err);
      showToast('✗ Lưu bài làm thất bại, thử lại sau.', true);
    });
  }

  var toastTimer = null;
  function showToast(message, isError){
    var el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = 'toast'; }, 3000);
  }

  function resetInputsOnly(){
    document.querySelectorAll('input[type=text]').forEach(function(i){ if(i.id!=='studentName') i.value=''; });
    document.querySelectorAll('input[type=checkbox]').forEach(function(i){ i.checked=false; });
    document.querySelectorAll('select').forEach(function(s){ s.value=''; s.style.borderColor = '#C9C1AC'; });
    document.querySelectorAll('.chk').forEach(function(c){ c.classList.remove('marked-correct','marked-wrong'); });
    clearFeedback();
    document.getElementById('scoreValue').innerHTML = '—<span class="max">/10</span>';
    document.getElementById('summaryNote').textContent = '';
  }

  document.getElementById('gradeBtn').addEventListener('click', grade);
  document.getElementById('resetBtn').addEventListener('click', resetInputsOnly);
  document.getElementById('shuffleBtn').addEventListener('click', function(){
    generateVariant();
    renderAll();
  });

  /* initial load */
  generateVariant();
  renderAll();
})();
</script>

</body>

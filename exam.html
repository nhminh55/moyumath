<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra — Toán 7</title>
<script>
  /* Runner đề chung: exam.html?preset=<id> — danh sách đề ở config/presets.json. */
  if(!localStorage.getItem('moyumath_user')){
    window.location.replace('login.html?redirect=' + encodeURIComponent('exam.html' + window.location.search));
  }
  /* Skin Tối / Sáng (js/ui/skin.js) — áp trước khi vẽ để khỏi nháy màu. */
  try { var s = localStorage.getItem('moyumath_skin'); if (s) document.documentElement.dataset.skin = s; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.20">
<link rel="stylesheet" href="css/components.css?v=1.0.20">
<link rel="stylesheet" href="css/pages/exam.css?v=1.0.20">
</head>
<body>

<div class="sheet">
  <header class="top">
    <div class="id-field">
      <label for="studentName">Họ tên</label>
      <input type="text" id="studentName" placeholder=".............................................." readonly>
    </div>
    <div class="exam-title">
      <h1 id="examHeading">KIỂM TRA — TOÁN 7</h1>
      <p id="examSubtitle"></p>
      <div class="variant-tag" id="variantTag"></div>
      <a href="index.html" class="practice-link-btn">Trang cá nhân</a>
    </div>
    <div class="score-box">
      <div class="label">ĐIỂM</div>
      <div class="value" id="scoreValue">—</div>
    </div>
  </header>

  <div class="timer-float" id="timerBox">
    <div class="label">THỜI GIAN</div>
    <div class="value" id="timerValue">--:--</div>
  </div>

  <div id="questions"><p class="q-prompt">Đang tải đề...</p></div>
</div>

<div class="actions">
  <button id="gradeBtn" data-sound="submit">Nộp bài &amp; chấm điểm</button>
  <button id="retrySaveBtn" hidden>↻ Lưu lại</button>
  <button id="shuffleBtn">🔀 Đổi đề</button>
  <button id="clearBtn">Xoá đáp án</button>
</div>
<p class="summary-note" id="summaryNote"></p>
<p class="summary-note footer-links" id="footerLinks"></p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/scratchpad.js?v=1.0.20"></script>
<script type="module" src="js/runner/exam-page.js?v=1.0.20"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý bài làm — Toán 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F3;
    --ink:#213A54;
    --ink-soft:#4B5A6B;
    --pen-red:#B23A2E;
    --pen-green:#3C7A5B;
    --border:#E3DFD2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E8E2D2;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  h1{
    font-family:'Lora',serif;
    font-size:24px;
    margin:0 0 4px;
  }
  .sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}

  .toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:18px;
  }
  .toolbar input[type="text"]{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #C9C1AC;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:#fff;
  }
  .toolbar button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .toolbar button:hover{opacity:0.9;}
  .stat{font-size:13px; color:var(--ink-soft);}

  .list{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 12px 30px -20px rgba(33,58,84,0.3);
  }
  .row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:#F3EFE2;}
  .thumb{
    width:56px; height:56px;
    border-radius:6px;
    object-fit:cover;
    border:1px solid var(--border);
    flex:0 0 auto;
    background:#fff;
  }
  .row-main{flex:1; min-width:0;}
  .row-name{font-weight:600; font-size:15px; color:var(--ink);}
  .row-time{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .row-score{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:18px;
    color:var(--pen-red);
    flex:0 0 auto;
    min-width:56px;
    text-align:right;
  }
  .empty, .loading{
    padding:40px 18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .lightbox{
    position:fixed; inset:0;
    background:rgba(20,25,35,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:200;
  }
  .lightbox.show{display:flex;}
  .lightbox-inner{
    background:#fff;
    border-radius:8px;
    max-width:min(720px, 100%);
    max-height:90vh;
    overflow:auto;
    padding:16px;
    position:relative;
  }
  .lightbox img{width:100%; display:block; border-radius:4px;}
  .lightbox-meta{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .lightbox-close{
    position:absolute;
    top:10px; right:10px;
    background:var(--ink);
    color:#fff;
    border:none;
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .download-link{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    text-decoration:underline;
  }

  @media (max-width:520px){
    .row{gap:10px; padding:12px;}
    .row-score{font-size:16px; min-width:44px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Quản lý bài làm — Toán 7</h1>
  <p class="sub">Danh sách bài làm học sinh đã nộp (lưu trên Firebase). Bấm vào một dòng để xem ảnh bài làm đầy đủ.</p>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Tìm theo họ tên...">
    <button id="refreshBtn">Tải lại</button>
    <span class="stat" id="statText"></span>
  </div>

  <div class="list" id="list">
    <div class="loading">Đang tải danh sách bài làm...</div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" alt="Bài làm">
    <div class="lightbox-meta">
      <span id="lightboxInfo"></span>
      <a class="download-link" id="lightboxDownload" download="bai-lam.jpg">Tải ảnh xuống</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collectionGroup, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCgaB8J61BqBhU4NwXq9MYBrRFRREYuxGg",
    authDomain: "moyumath.firebaseapp.com",
    projectId: "moyumath",
    storageBucket: "moyumath.firebasestorage.app",
    messagingSenderId: "690475633701",
    appId: "1:690475633701:web:e839cdeee12e9b1456c3cc",
    measurementId: "G-9RPGBW0VK5"
  };

  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  var allSubmissions = [];

  function formatTime(ts){
    if(!ts || !ts.toDate) return '';
    var d = ts.toDate();
    return d.toLocaleString('vi-VN');
  }

  function render(filterText){
    var listEl = document.getElementById('list');
    var filtered = allSubmissions.filter(function(s){
      if(!filterText) return true;
      return s.studentName.toLowerCase().indexOf(filterText.toLowerCase()) !== -1;
    });
    document.getElementById('statText').textContent = filtered.length + ' bài làm';

    if(filtered.length === 0){
      listEl.innerHTML = '<div class="empty">Chưa có bài làm nào.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(s, i){
      return '<div class="row" data-idx="' + allSubmissions.indexOf(s) + '">' +
        '<img class="thumb" src="' + s.image + '" alt="">' +
        '<div class="row-main">' +
          '<div class="row-name">' + s.studentName + '</div>' +
          '<div class="row-time">' + formatTime(s.createdAt) + '</div>' +
        '</div>' +
        '<div class="row-score">' + s.score + '</div>' +
      '</div>';
    }).join('');

    listEl.querySelectorAll('.row').forEach(function(row){
      row.addEventListener('click', function(){
        var s = allSubmissions[parseInt(row.dataset.idx, 10)];
        openLightbox(s);
      });
    });
  }

  function openLightbox(s){
    document.getElementById('lightboxImg').src = s.image;
    document.getElementById('lightboxInfo').textContent = s.studentName + ' · ' + s.score + ' · ' + formatTime(s.createdAt);
    document.getElementById('lightboxDownload').href = s.image;
    document.getElementById('lightboxDownload').download = s.studentName + '-' + s.score.replace('/','-') + '.jpg';
    document.getElementById('lightbox').classList.add('show');
  }
  document.getElementById('lightboxClose').addEventListener('click', function(){
    document.getElementById('lightbox').classList.remove('show');
  });
  document.getElementById('lightbox').addEventListener('click', function(e){
    if(e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('show');
  });

  function loadSubmissions(){
    document.getElementById('list').innerHTML = '<div class="loading">Đang tải danh sách bài làm...</div>';
    var q = query(collectionGroup(db, 'bài làm'), orderBy('createdAt', 'desc'));
    getDocs(q).then(function(snap){
      allSubmissions = [];
      snap.forEach(function(doc){
        allSubmissions.push(doc.data());
      });
      render(document.getElementById('searchInput').value.trim());
    }).catch(function(err){
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="empty">Lỗi tải dữ liệu: ' + err.message + '</div>';
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadSubmissions);
  document.getElementById('searchInput').addEventListener('input', function(){
    render(this.value.trim());
  });

  loadSubmissions();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiệm Phép Thuật — Toán 7</title>
<script>
  if(!localStorage.getItem('moyumath_user')){
    window.location.replace('login.html?redirect=' + encodeURIComponent('shop.html' + location.hash));
  }
  /* Giao diện từ Tiệm Phép Thuật (cache js/ui/cosmetics.js) — áp trước khi vẽ để khỏi nháy màu. */
  try { var t = (JSON.parse(localStorage.getItem('moyumath_cosmetics')) || {}).theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { var s = localStorage.getItem('moyumath_skin'); if (s) document.documentElement.dataset.skin = s; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.22">
<link rel="stylesheet" href="css/components.css?v=1.0.22">
<link rel="stylesheet" href="css/cosmetics.css?v=1.0.22">
<link rel="stylesheet" href="css/pages/shop.css?v=1.0.22">
<link rel="stylesheet" href="css/themes.css?v=1.0.22">
</head>
<body>
  <div class="wrap">
    <header class="card shop-top">
      <div class="shop-hero">
        <h1>🔮 Tiệm Phép Thuật</h1>
        <p class="shop-sub">Đổi ⭐ kiếm được khi luyện tập và học đều mỗi ngày lấy danh hiệu, khung avatar, giao diện, hiệu ứng và thẻ sưu tầm.</p>
        <div class="shop-me" id="meIdentity"></div>
        <button type="button" class="secondary shop-photo-btn" id="photoBtn">📷 Ảnh đại diện</button>
      </div>
      <div class="shop-wallet">
        <span class="shop-wallet-label">Sao của bé</span>
        <span class="shop-wallet-value" id="balance">⭐ …</span>
        <span class="shop-wallet-note" id="walletNote"></span>
        <div class="shop-wallet-links">
          <span id="soundSlot"></span>
          <button type="button" class="skin-toggle" data-skin-toggle>🌙 Tối</button>
          <a class="secondary" href="index.html">← Trang cá nhân</a>
        </div>
      </div>
    </header>

    <nav class="shop-tabs" id="tabs" role="tablist"></nav>
    <section class="card shop-panel" id="panel"></section>
  </div>

  <div class="shop-modal-overlay" id="modal" hidden>
    <div class="shop-modal" role="dialog" aria-modal="true">
      <div id="modalBody"></div>
      <div class="shop-modal-actions" id="modalActions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/ui/skin.js?v=1.0.22"></script>
  <script type="module" src="js/pages/shop-page.js?v=1.0.22"></script>
</body>
</html>

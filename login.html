<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Moyu Math</title>
<script>
  /* Skin Tối / Sáng (js/ui/skin.js) — áp trước khi vẽ để khỏi nháy màu. */
  try { var s = localStorage.getItem('moyumath_skin'); if (s) document.documentElement.dataset.skin = s; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.23">
<style>
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
  }
  .login-deco{position:fixed; border-radius:0;}
  .login-deco span:nth-child(3n){color:var(--accent-ink);}
  .card{
    position:relative;
    width:100%;
    max-width:390px;
    margin:60px 0 0;
    padding:70px 30px 28px;
    border-radius:20px;
    box-shadow:var(--shadow-lift);
  }
  .card .mascot{position:absolute; left:50%; top:-74px; margin-left:-62px; width:124px; height:auto; filter:drop-shadow(0 10px 12px rgba(0,0,0,.15));}
  .card h1{
    font-size:36px;
    line-height:1.1;
    margin:0 0 4px;
    text-align:center;
    color:var(--ink);
  }
  .card h1 span{color:var(--accent-ink);}
  .card .sub{font-family:'Lora', serif; font-size:17px; line-height:1.45; color:var(--ink); text-align:center; margin:0 0 24px;}
  .card .sub em{font-style:normal; color:var(--accent-ink);}

  label{display:block; font-family:var(--font-display); font-size:15px; color:var(--ink); margin:0 0 6px 4px;}
  input[type="text"], input[type="password"]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    font-size:16px;
    margin-bottom:16px;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--paper);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="text"]:focus, input[type="password"]:focus{
    outline:none;
    border-color:var(--gold);
    background:var(--paper);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent);
  }
  .error{
    color:var(--pen-red);
    background:color-mix(in srgb, var(--pen-red) 15%, transparent);
    border-radius:12px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    margin:0 0 12px;
    display:none;
  }
  .error.show{display:block;}
  button#loginBtn{width:100%; margin-top:6px; padding:14px !important; font-size:18px !important;}
  button#loginBtn:disabled{opacity:.7; cursor:progress;}
  .admin-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .admin-link:hover{color:var(--accent-ink); text-decoration:underline;}
</style>
</head>
<body>

<div class="math-deco login-deco" aria-hidden="true">
  <span style="left:6%;top:10%;font-size:18px;">✦</span><span style="left:18%;top:72%;font-size:14px;">✦</span>
  <span style="left:84%;top:14%;font-size:18px;">✦</span><span style="left:76%;top:78%;font-size:18px;">✦</span>
  <span style="left:44%;top:6%;font-size:18px;">✦</span><span style="left:4%;top:44%;font-size:18px;">✦</span>
  <span style="left:92%;top:48%;font-size:10px;">✦</span><span style="left:52%;top:88%;font-size:10px;">✦</span>
  <span style="left:30%;top:30%;font-size:18px;">✦</span><span style="left:66%;top:36%;font-size:14px;">✦</span>
</div>

<button type="button" class="skin-toggle corner" data-skin-toggle>🌙 Tối</button>

<div class="card">
  <img class="mascot" src="img/moyu-owl.svg" alt="" width="124" height="128">
  <h1>Moyu <span>Math</span></h1>
  <p class="sub">Chào mừng bạn quay lại!<br>Cùng <em>luyện Toán mỗi ngày</em> nhé.</p>

  <label for="username">Tên đăng nhập</label>
  <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false">

  <label for="password">Mật khẩu</label>
  <input type="password" id="password" autocomplete="current-password">
  <div class="error" id="loginError">Tên đăng nhập hoặc mật khẩu không đúng.</div>

  <button id="loginBtn" class="primary">Đăng nhập</button>
  <a href="admin.html" class="admin-link">⚙ Vào trang Admin</a>
</div>

<script type="module" src="js/ui/skin.js?v=1.0.23"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCgaB8J61BqBhU4NwXq9MYBrRFRREYuxGg",
    authDomain: "moyumath.firebaseapp.com",
    projectId: "moyumath",
    storageBucket: "moyumath.firebasestorage.app",
    messagingSenderId: "690475633701",
    appId: "1:690475633701:web:e839cdeee12e9b1456c3cc",
    measurementId: "G-9RPGBW0VK5"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  function doLogin(){
    var errEl = document.getElementById('loginError');
    errEl.classList.remove('show');
    var username = document.getElementById('username').value.trim().toLowerCase().replace(/\s+/g, '');
    var pw = document.getElementById('password').value;
    if(!username || !pw){
      errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
      errEl.classList.add('show');
      return;
    }
    var loginBtn = document.getElementById('loginBtn');
    loginBtn.disabled = true;
    getDoc(doc(db, 'students', username)).then(function(snap){
      loginBtn.disabled = false;
      var user = snap.exists() ? snap.data() : null;
      if(!user || pw !== user.password){
        errEl.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';
        errEl.classList.add('show');
        return;
      }
      localStorage.setItem('moyumath_user', username);
      localStorage.setItem('moyumath_displayName', user.displayName);
      localStorage.setItem('moyumath_class', user.class || '');
      window.location.href = safeRedirect();
    }).catch(function(err){
      loginBtn.disabled = false;
      console.error(err);
      errEl.textContent = 'Lỗi đăng nhập: ' + err.message;
      errEl.classList.add('show');
    });
  }

  /* Chỉ quay lại một trang .html nội bộ (có thể kèm ?query) — chặn redirect ra site khác hoặc "javascript:". */
  function safeRedirect(){
    var r = new URLSearchParams(window.location.search).get('redirect') || '';
    return /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(r) ? r : 'index.html';
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('username').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
  });

  /* already logged in? skip straight through */
  if(localStorage.getItem('moyumath_user')){
    window.location.href = safeRedirect();
  }
</script>

</body>
</html>

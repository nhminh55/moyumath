<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Moyu Math</title>
<script>
  /* Skin Tối / Sáng (js/ui/skin.js) — áp trước khi vẽ để khỏi nháy màu. */
  try { var s = localStorage.getItem('moyumath_skin'); if (s) document.documentElement.dataset.skin = s; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=DynaPuff:wght@600;700&family=Nunito:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.37">
<style>
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-x:hidden;
  }
  .login-deco{position:fixed; border-radius:0;}
  .login-deco span:nth-child(3n){color:var(--accent-ink);}
  .card{
    position:relative;
    width:100%;
    max-width:460px;
    margin:96px 0 0;
    padding:78px 36px 30px;
    border-radius:28px;
    box-shadow:var(--shadow-lift);
  }
  .card .mascot{position:absolute; left:50%; top:-96px; margin-left:-90px; width:180px; height:auto; filter:drop-shadow(0 10px 12px rgba(0,0,0,.15));}
  .card h1{
    font-family:'DynaPuff', 'Fredoka', var(--font-display), sans-serif;
    font-weight:700;
    font-size:64px;
    line-height:1;
    letter-spacing:-.025em;
    margin:0 0 26px;
    text-align:center;
    color:var(--ink);
  }
  .logo{position:relative; display:inline-block; padding:0 0 16px;}
  .logo .l{display:inline-block;}
  .logo .l:nth-child(1){transform:translateY(6px) rotate(-6deg);}
  .logo .l:nth-child(2){transform:translateY(0) rotate(-3deg);}
  .logo .l:nth-child(3){transform:translateY(-6px) rotate(1deg);}
  .logo .l:nth-child(4){transform:translateY(-3px) rotate(4deg);}
  .logo .gap{display:inline-block; width:.04em;}
  .logo .l:nth-child(6){transform:translateY(5px) rotate(-5deg);}
  .logo .l:nth-child(7){transform:translateY(-3px) rotate(-1deg);}
  .logo .l:nth-child(8){transform:translateY(-8px) rotate(2deg);}
  .logo .l:nth-child(9){transform:translateY(-12px) rotate(6deg);}
  .logo .math{color:var(--btn-bg);}
  .logo .swoosh{position:absolute; left:38%; bottom:-6px; width:30%; height:14px; color:var(--sun); pointer-events:none;}
  .logo .burst{position:absolute; right:-22px; top:-8px; width:38px; height:38px; color:var(--sun); pointer-events:none;}
  .card .sub{font-family:'Nunito', 'Inter', sans-serif; font-weight:600; font-size:18px; line-height:1.5; color:var(--ink-soft); text-align:center; margin:0 0 26px;}
  .card .sub em{font-style:normal; color:var(--accent-ink);}

  label{display:block; font-family:'Nunito', var(--font-display), sans-serif; font-weight:700; font-size:16px; color:var(--ink); margin:0 0 8px 4px;}
  .field{position:relative; margin-bottom:18px;}
  .field > svg{position:absolute; left:16px; top:50%; width:20px; height:20px; margin-top:-10px; color:var(--ink-soft); pointer-events:none;}
  input[type="text"], input[type="password"]{
    width:100%;
    padding:14px 46px 14px 48px;
    border-radius:14px;
    border:1px solid var(--border);
    font-size:16px;
    font-family:'Nunito', 'Inter', sans-serif;
    font-weight:600;
    color:var(--ink);
    background:var(--paper);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder{color:var(--ink-soft); font-weight:500; opacity:.8;}
  input[type="text"]:focus, input[type="password"]:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent);
  }
  .eye{position:absolute; right:6px; top:50%; width:40px; height:40px; margin-top:-20px; padding:0; border:0; background:none; color:var(--ink-soft); cursor:pointer; border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .eye:hover{color:var(--accent-ink);}
  .eye svg{position:static; margin:0; width:20px; height:20px;}
  .error{
    color:var(--pen-red);
    background:color-mix(in srgb, var(--pen-red) 15%, transparent);
    border-radius:12px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    margin:0 0 12px;
    display:none;
  }
  .error.show{display:block;}
  button#loginBtn{width:100%; margin-top:6px; padding:15px !important; font-size:18px !important; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px;}
  button#loginBtn:disabled{opacity:.7; cursor:progress;}
  .admin-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .admin-link:hover{color:var(--accent-ink); text-decoration:underline;}
</style>
</head>
<body>

<div class="math-deco login-deco" aria-hidden="true">
  <span style="left:6%;top:10%;font-size:18px;">✦</span><span style="left:18%;top:72%;font-size:14px;">✦</span>
  <span style="left:84%;top:14%;font-size:18px;">✦</span><span style="left:76%;top:78%;font-size:18px;">✦</span>
  <span style="left:44%;top:6%;font-size:18px;">✦</span><span style="left:4%;top:44%;font-size:18px;">✦</span>
  <span style="left:92%;top:48%;font-size:10px;">✦</span><span style="left:52%;top:88%;font-size:10px;">✦</span>
  <span style="left:30%;top:30%;font-size:18px;">✦</span><span style="left:66%;top:36%;font-size:14px;">✦</span>
</div>

<button type="button" class="skin-toggle corner" data-skin-toggle>🌙 Tối</button>

<div class="card">
  <img class="mascot" src="img/moyu-mascot.png" alt="" width="180" height="180">
  <h1 aria-label="MoyuMath">
    <span class="logo" aria-hidden="true"><span class="l">M</span><span class="l">o</span><span class="l">y</span><span class="l">u</span><span class="gap"></span><span class="math"><span class="l">M</span><span class="l">a</span><span class="l">t</span><span class="l">h</span></span>
      <svg class="swoosh" viewBox="0 0 100 16" preserveAspectRatio="none"><path d="M3 11 Q45 -2 97 6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      <svg class="burst" viewBox="0 0 34 34"><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 22 L13 16"/><path d="M14 9 L17 1"/><path d="M24 14 L32 11"/></g></svg>
    </span>
  </h1>
  <p class="sub">Chào mừng bạn quay lại!<br>Cùng <em>luyện Toán mỗi ngày</em> nhé.</p>

  <label for="username">Tên đăng nhập</label>
  <div class="field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" autocapitalize="none" spellcheck="false">
  </div>

  <label for="password">Mật khẩu</label>
  <div class="field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
    <button type="button" class="eye" id="togglePw" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="error" id="loginError">Tên đăng nhập hoặc mật khẩu không đúng.</div>

  <button id="loginBtn" class="primary">Đăng nhập <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <a href="admin.html" class="admin-link">⚙ Vào trang Admin</a>
</div>

<script type="module" src="js/ui/skin.js?v=1.0.37"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCgaB8J61BqBhU4NwXq9MYBrRFRREYuxGg",
    authDomain: "moyumath.firebaseapp.com",
    projectId: "moyumath",
    storageBucket: "moyumath.firebasestorage.app",
    messagingSenderId: "690475633701",
    appId: "1:690475633701:web:e839cdeee12e9b1456c3cc",
    measurementId: "G-9RPGBW0VK5"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  function doLogin(){
    var errEl = document.getElementById('loginError');
    errEl.classList.remove('show');
    var username = document.getElementById('username').value.trim().toLowerCase().replace(/\s+/g, '');
    var pw = document.getElementById('password').value;
    if(!username || !pw){
      errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
      errEl.classList.add('show');
      return;
    }
    var loginBtn = document.getElementById('loginBtn');
    loginBtn.disabled = true;
    getDoc(doc(db, 'students', username)).then(function(snap){
      loginBtn.disabled = false;
      var user = snap.exists() ? snap.data() : null;
      if(!user || pw !== user.password){
        errEl.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';
        errEl.classList.add('show');
        return;
      }
      if(user.disabled){
        errEl.textContent = 'Tài khoản này đã bị tạm khoá. Hãy hỏi thầy/cô.';
        errEl.classList.add('show');
        return;
      }
      localStorage.setItem('moyumath_user', username);
      localStorage.setItem('moyumath_displayName', user.displayName);
      localStorage.setItem('moyumath_class', user.class || '');
      window.location.href = safeRedirect();
    }).catch(function(err){
      loginBtn.disabled = false;
      console.error(err);
      errEl.textContent = 'Lỗi đăng nhập: ' + err.message;
      errEl.classList.add('show');
    });
  }

  /* Chỉ quay lại một trang .html nội bộ (có thể kèm ?query) — chặn redirect ra site khác hoặc "javascript:". */
  function safeRedirect(){
    var r = new URLSearchParams(window.location.search).get('redirect') || '';
    return /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(r) ? r : 'index.html';
  }

  document.getElementById('togglePw').addEventListener('click', function(){
    var pw = document.getElementById('password');
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('username').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
  });

  /* already logged in? skip straight through */
  if(localStorage.getItem('moyumath_user')){
    window.location.href = safeRedirect();
  }
</script>

</body>
</html>

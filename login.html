<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Moyu Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.5">
<style>
  
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.4), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.25), transparent 45%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.02);
    padding:32px 28px;
  }
  .card h1{
    font-family:'Lora', serif;
    font-size:21px;
    margin:0 0 4px;
    color:var(--ink);
    text-align:center;
  }
  .card .sub{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    margin:0 0 24px;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  input[type="text"], input[type="password"]{
    width:100%;
    padding:11px 16px;
    border-radius:9999px;
    border:1px solid var(--border);
    font-size:15px;
    margin-bottom:16px;
    font-family:'Inter', sans-serif;
    background:#fff;
  }
  .error{
    color:var(--pen-red);
    font-size:13px;
    margin:0 0 12px;
    display:none;
  }
  .error.show{display:block;}

  button#loginBtn{
    width:100%;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px;
    border-radius:9999px;
    border:none;
    background:var(--gold);
    color:#fff;
    cursor:pointer;
    margin-top:8px;
    box-shadow:0 4px 12px rgba(99,102,241,0.25);
    transition:all 0.2s ease;
  }
  button#loginBtn:hover{opacity:0.92;}
  .admin-link{
    display:block;
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .admin-link:hover{color:var(--ink); text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <h1>Moyu Math</h1>
  <p class="sub">Nhập tên đăng nhập và mật khẩu để tiếp tục.</p>

  <label for="username">Tên đăng nhập</label>
  <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false">

  <label for="password">Mật khẩu</label>
  <input type="password" id="password" autocomplete="current-password">
  <div class="error" id="loginError">Tên đăng nhập hoặc mật khẩu không đúng.</div>

  <button id="loginBtn">Đăng nhập</button>
  <a href="admin.html" class="admin-link">⚙ Vào trang Admin</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCgaB8J61BqBhU4NwXq9MYBrRFRREYuxGg",
    authDomain: "moyumath.firebaseapp.com",
    projectId: "moyumath",
    storageBucket: "moyumath.firebasestorage.app",
    messagingSenderId: "690475633701",
    appId: "1:690475633701:web:e839cdeee12e9b1456c3cc",
    measurementId: "G-9RPGBW0VK5"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);

  function doLogin(){
    var errEl = document.getElementById('loginError');
    errEl.classList.remove('show');
    var username = document.getElementById('username').value.trim().toLowerCase().replace(/\s+/g, '');
    var pw = document.getElementById('password').value;
    if(!username || !pw){
      errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
      errEl.classList.add('show');
      return;
    }
    var loginBtn = document.getElementById('loginBtn');
    loginBtn.disabled = true;
    getDoc(doc(db, 'students', username)).then(function(snap){
      loginBtn.disabled = false;
      var user = snap.exists() ? snap.data() : null;
      if(!user || pw !== user.password){
        errEl.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';
        errEl.classList.add('show');
        return;
      }
      localStorage.setItem('moyumath_user', username);
      localStorage.setItem('moyumath_displayName', user.displayName);
      localStorage.setItem('moyumath_class', user.class || '');
      window.location.href = safeRedirect();
    }).catch(function(err){
      loginBtn.disabled = false;
      console.error(err);
      errEl.textContent = 'Lỗi đăng nhập: ' + err.message;
      errEl.classList.add('show');
    });
  }

  /* Chỉ quay lại một trang .html nội bộ (có thể kèm ?query) — chặn redirect ra site khác hoặc "javascript:". */
  function safeRedirect(){
    var r = new URLSearchParams(window.location.search).get('redirect') || '';
    return /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(r) ? r : 'index.html';
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('username').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
  });

  /* already logged in? skip straight through */
  if(localStorage.getItem('moyumath_user')){
    window.location.href = safeRedirect();
  }
</script>

</body>
</html>

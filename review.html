<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập — Toán 7</title>
<script>
  if(!localStorage.getItem('moyumath_user')){
    window.location.replace('login.html?redirect=' + encodeURIComponent('review.html' + location.search));
  }
  /* Giao diện từ Tiệm Phép Thuật (cache js/ui/cosmetics.js) — áp trước khi vẽ để khỏi nháy màu. */
  try { var t = (JSON.parse(localStorage.getItem('moyumath_cosmetics')) || {}).theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@600;700&family=Paytone+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.16">
<link rel="stylesheet" href="css/components.css?v=1.0.16">
<link rel="stylesheet" href="css/pages/review.css?v=1.0.16">
<link rel="stylesheet" href="css/themes.css?v=1.0.16">
</head>
<body>
  <div class="wrap">
    <header class="review-top">
      <div class="math-deco" aria-hidden="true">
        <span style="left:58%;top:12%;font-size:14px;">✦</span><span style="left:72%;top:58%;font-size:14px;">✦</span>
        <span style="left:88%;top:20%;font-size:14px;">✦</span>
      </div>
      <div class="review-top-text">
        <h1 id="reviewTitle">Ôn tập</h1>
        <p id="reviewSubtitle" class="review-sub"></p>
      </div>
      <a class="secondary" href="index.html">← Trang cá nhân</a>
    </header>

    <div class="card review-exam" id="examCard" hidden>
      <div>
        <h2 class="review-h2">Làm đề thi thử</h2>
        <p class="review-sub" id="examNote"></p>
      </div>
      <a class="primary" id="examLink" href="#">🏁 Bắt đầu thi thử</a>
    </div>

    <div class="card">
      <h2 class="review-h2">Luyện tập theo từng câu của đề cương</h2>
      <p class="review-sub">Bấm vào một dạng bài để luyện riêng — mỗi lần làm là một đề mới, có chấm điểm và lời giải từng bước.
        <span id="sourceLink"></span></p>
      <div id="reviewGroups"></div>
    </div>
  </div>

  <script type="module" src="js/pages/review-page.js?v=1.0.16"></script>
</body>
</html>
